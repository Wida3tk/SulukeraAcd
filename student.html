<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Information System (SIS) | نظام معلومات الطالب</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --primary:#0D40FC; --dark:#001442; --neon:#55D7FF;
  --bg:#f0f4ff; --white:#ffffff; --border:#d0dcf8;
  --text:#020716; --muted:#4a5580; --light:#8090bb;
  --success:#1a7a3c; --success-bg:#eafaf0;
  --danger:#c0392b; --danger-bg:#fdf0ef;
  --warning:#b35c00; --warning-bg:#fff5e6;
  --radius:10px; --radius-lg:16px;
  --shadow:0 2px 16px rgba(13,64,252,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;}

/* ── LOGIN SCREEN ── */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--dark) 0%,#001d6e 60%,#0D40FC 100%);
  padding:1rem;
}
.login-wrap{width:100%;max-width:440px;}
.login-card{
  background:white;border-radius:20px;padding:2.5rem 2rem;
  box-shadow:0 30px 70px rgba(0,0,0,0.3);
}
.login-logo{text-align:center;margin-bottom:1.5rem;}
.login-logo img{width:200px;max-width:80%;height:auto;}
.login-logo p{font-size:13px;color:var(--muted);margin-top:6px;}

.role-tabs{display:flex;gap:6px;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:1.5rem;}
.role-tab{
  flex:1;padding:9px;border-radius:8px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--muted);background:transparent;
  font-family:inherit;transition:all 0.2s;
}
.role-tab.active{background:var(--primary);color:white;box-shadow:0 2px 8px rgba(13,64,252,0.3);}

.field{margin-bottom:1rem;}
.field label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);
  border-radius:var(--radius);font-size:14px;font-family:inherit;
  background:white;color:var(--text);transition:border 0.2s;
}
.field select{appearance:auto;cursor:pointer;}
.field textarea{min-height:110px;resize:vertical;line-height:1.6;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,64,252,0.1);}
.btn-login{
  width:100%;padding:13px;background:var(--primary);color:white;
  border:none;border-radius:var(--radius);font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all 0.2s;margin-top:4px;
}
.btn-login:hover{background:var(--dark);transform:translateY(-1px);}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:8px;display:none;}
.login-hint{
  margin-top:1rem;padding:10px 12px;background:var(--bg);
  border-radius:var(--radius);font-size:11px;color:var(--muted);
  border:1px solid var(--border);text-align:center;
}

/* ── APP ── */
#appScreen{display:none;}
.topbar{
  background:white;border-bottom:1px solid var(--border);
  padding:0.8rem 1.5rem;display:flex;align-items:center;
  justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:100;
}
.topbar-logo img{height:38px;width:auto;}
.topbar-user{display:flex;align-items:center;gap:10px;}
.user-badge{
  background:var(--bg);border:1px solid var(--border);
  border-radius:99px;padding:5px 14px;font-size:12px;
  color:var(--muted);font-weight:600;
}
.user-role{
  font-size:10px;padding:3px 10px;border-radius:99px;font-weight:700;
}
.role-lecturer{background:rgba(85,215,255,0.2);color:#005f7f;}
.role-student{background:rgba(13,64,252,0.1);color:var(--primary);}
.btn-out{
  padding:6px 14px;border-radius:var(--radius);border:1.5px solid var(--border);
  background:white;cursor:pointer;font-size:12px;font-family:inherit;
  color:var(--muted);
}
.btn-out:hover{background:var(--bg);color:var(--text);}

.content{padding:1.5rem;max-width:1100px;margin:0 auto;}

/* ── STUDENT VIEW ── */
.student-header{
  background:var(--dark);border-radius:var(--radius-lg);
  padding:1.5rem 2rem;color:white;display:flex;align-items:center;
  gap:1.2rem;margin-bottom:1.2rem;
}
.transcript-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:1rem;padding:16px 18px;border:1px solid #d8e4fb;border-radius:14px;background:linear-gradient(135deg,#f8fbff,#eaf1ff);}
.transcript-summary-name{font-size:18px;font-weight:900;color:var(--dark);}
.transcript-summary-meta{font-size:11px;color:var(--muted);margin-top:5px;}
.transcript-summary-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.transcript-summary-actions{display:flex;gap:8px;flex-wrap:wrap;}
.student-avatar{
  width:56px;height:56px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;border:3px solid rgba(85,215,255,0.4);flex-shrink:0;
}
.avg-circle{
  width:72px;height:72px;border-radius:50%;border:4px solid rgba(255,255,255,0.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex-shrink:0;margin-right:auto;
}
.avg-num{font-size:22px;font-weight:900;line-height:1;}
.avg-label{font-size:9px;color:rgba(255,255,255,0.6);margin-top:2px;}

/* ── SUBJECT CARDS ── */
.subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}
.subject-card{
  background:white;border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--shadow);
}
.course-row-planned{opacity:.62;background:#f8faff;}.course-row-planned td{color:#71809f;}
.subject-card-head{
  background:var(--dark);padding:0.9rem 1.1rem;
  display:flex;justify-content:space-between;align-items:center;
}
.subject-card-body{padding:1rem 1.1rem;}
.grade-badge{
  font-size:22px;font-weight:900;color:white;
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.grade-A{background:#1a7a3c;}
.grade-B{background:#0D40FC;}
.grade-C{background:#b35c00;}
.grade-F{background:#c0392b;}

.weeks-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:0.8rem;}
.week-box{
  background:var(--bg);border-radius:8px;padding:8px 6px;
  text-align:center;border:1px solid var(--border);
}
.week-box-label{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.week-box-val{font-size:16px;font-weight:800;color:var(--primary);}
.week-box-max{font-size:9px;color:var(--light);}
.week-detail{font-size:9px;color:var(--muted);margin-top:3px;}

.exam-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 12px;border-radius:8px;margin-top:6px;
}
.exam-pass{background:var(--success-bg);}
.exam-fail{background:var(--danger-bg);}

.progress{height:5px;background:#e8ecf8;border-radius:99px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;border-radius:99px;}
.pf-high{background:linear-gradient(90deg,#1a7a3c,#27ae60);}
.pf-mid{background:linear-gradient(90deg,#b35c00,#f39c12);}
.pf-low{background:linear-gradient(90deg,#c0392b,#e74c3c);}

/* ── LECTURER VIEW ── */
.lec-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.lec-tab{
  padding:7px 18px;border-radius:99px;border:1.5px solid var(--border);
  cursor:pointer;font-size:12px;color:var(--muted);background:white;
  font-weight:600;transition:all 0.15s;font-family:inherit;
}
.lec-tab.active{background:var(--primary);color:white;border-color:var(--primary);}
.lec-tab:hover{border-color:var(--primary);color:var(--primary);}
.faculty-welcome{position:relative;overflow:hidden;background:linear-gradient(125deg,#001442 0%,#073494 56%,#0d40fc 100%);border-radius:22px;padding:30px;color:#fff;margin-bottom:16px;box-shadow:0 18px 38px rgba(0,20,66,.2);}
.faculty-welcome:before,.faculty-welcome:after{content:'';position:absolute;border-radius:50%;pointer-events:none;}
.faculty-welcome:before{width:260px;height:260px;background:rgba(85,215,255,.14);left:-95px;top:-145px;}
.faculty-welcome:after{width:170px;height:170px;background:rgba(255,255,255,.08);left:22%;bottom:-125px;}
.faculty-welcome-inner{position:relative;z-index:1;display:flex;align-items:stretch;justify-content:space-between;gap:20px;}
.faculty-kicker{font-size:11px;font-weight:800;letter-spacing:.2px;color:#8ce8ff;margin-bottom:9px;}
.faculty-welcome h1{font-size:26px;line-height:1.3;margin:0;}
.faculty-welcome p{font-size:13px;line-height:1.7;color:rgba(255,255,255,.8);max-width:570px;margin:8px 0 18px;}
.faculty-badges{display:flex;flex-wrap:wrap;gap:8px;}
.faculty-badge{padding:7px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.1);font-size:11px;font-weight:700;}
.faculty-next{min-width:260px;align-self:center;padding:16px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:rgba(0,13,55,.28);backdrop-filter:blur(8px);}
.faculty-next-label{font-size:10px;color:#9de8ff;font-weight:800;margin-bottom:8px;}
.faculty-next-subject{font-size:15px;font-weight:800;line-height:1.5;}
.faculty-next-meta{font-size:11px;color:rgba(255,255,255,.72);margin-top:7px;}
.program-calendar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
.program-calendar-item{border:1px solid #e0e9f8;border-radius:14px;padding:13px;background:#fff;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;}
.program-calendar-order{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#eaf0ff;color:#0d40fc;font-size:12px;font-weight:900;}
.program-calendar-item.exam .program-calendar-order{background:#fff2df;color:#a75500;}.program-calendar-item.break .program-calendar-order{background:#eaf8ed;color:#19753c;}
.program-calendar-title{font-size:12px;font-weight:800;color:#102145;}.program-calendar-date{font-size:11px;color:#596883;line-height:1.55;margin-top:4px;}.program-calendar-duration{font-size:10px;color:#0d40fc;font-weight:700;margin-top:4px;}
.policy-hero{padding:18px 20px;margin-bottom:14px;border:1px solid #d9e5fb;border-radius:18px;background:linear-gradient(135deg,#ffffff,#edf4ff);box-shadow:0 8px 24px rgba(13,64,252,.06);}.policy-eyebrow{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:5px;}.policy-hero h1{font-size:22px;color:var(--dark);margin:0 0 5px;}.policy-hero p{font-size:12px;color:var(--muted);margin:0;}.policy-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}.policy-tab{padding:9px 15px;border:1px solid #d4e1fa;border-radius:10px;background:#fff;color:#51617e;font:700 12px inherit;cursor:pointer;transition:.18s;}.policy-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 12px rgba(13,64,252,.17);}.policy-group{padding:16px 18px;margin-bottom:12px;}.policy-group .card-title{margin-bottom:10px;padding-bottom:7px;font-size:13px;}.policy-list{display:grid;gap:7px;}.policy-item{border:1px solid #dbe5f7;border-radius:10px;background:#fff;overflow:hidden;transition:border-color .18s,box-shadow .18s;}.policy-item:hover{border-color:#aac2fb;box-shadow:0 5px 14px rgba(13,64,252,.06);}.policy-item summary{cursor:pointer;padding:10px 13px;list-style:none;display:flex;align-items:center;gap:10px;}.policy-item summary::-webkit-details-marker{display:none;}.policy-item summary:before{content:'+';width:20px;height:20px;border-radius:50%;background:#edf3ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;flex-shrink:0;}.policy-item[open] summary:before{content:'−';background:var(--primary);color:#fff;}.policy-item-title{font-size:13px;font-weight:800;color:#15294d;}.policy-item-brief{font-size:11px;color:#667594;line-height:1.55;margin-top:2px;}.policy-item-body{padding:10px 13px 13px;margin:0 13px;border-top:1px solid #e9effa;color:#566785;font-size:12px;line-height:1.9;}
@media(max-width:700px){.faculty-welcome{padding:22px 20px;}.faculty-welcome-inner{flex-direction:column;}.faculty-next{min-width:0;}.faculty-welcome h1{font-size:22px;}}

.card{background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem 1.4rem;margin-bottom:1rem;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:700;margin-bottom:1rem;padding-bottom:8px;border-bottom:2px solid var(--bg);display:flex;align-items:center;gap:7px;}

table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--dark);color:rgba(255,255,255,0.85);padding:9px 10px;text-align:right;font-weight:600;font-size:11px;white-space:nowrap;}
th:first-child{border-radius:0 6px 0 0;}th:last-child{border-radius:6px 0 0 0;}
td{padding:8px 10px;border-bottom:1px solid #f0f4ff;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8faff;}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;}
.badge-A{background:#d4edda;color:#155724;}
.badge-B{background:#d1ecf1;color:#0c5460;}
.badge-C{background:#fff3cd;color:#856404;}
.badge-F{background:#f8d7da;color:#721c24;}
.badge-pass{background:#d4edda;color:#155724;}
.badge-fail{background:#f8d7da;color:#721c24;}
.badge-warn{background:#fff3cd;color:#856404;}
.badge-info{background:#dbeafe;color:#1d4ed8;}

.grade-input{
  width:52px;padding:4px;border:1.5px solid var(--border);
  border-radius:6px;text-align:center;font-size:12px;
  font-family:monospace;background:white;
}
.grade-input:focus{outline:none;border-color:var(--primary);}

.week-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.week-tab{
  padding:6px 16px;border-radius:99px;border:1.5px solid var(--border);
  cursor:pointer;font-size:12px;color:var(--muted);background:white;
  font-weight:600;transition:all 0.15s;font-family:inherit;
}
.week-tab.active{background:var(--primary);color:white;border-color:var(--primary);}

.btn{padding:7px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:white;cursor:pointer;font-size:12px;color:var(--text);font-family:inherit;font-weight:500;}
.btn-primary{background:var(--primary);color:white;border-color:var(--primary);}
.btn-primary:hover{background:var(--dark);}
.btn-success{background:var(--success);color:white;border-color:var(--success);}

.stat-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.stat-box{background:white;border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.9rem 1.2rem;flex:1;min-width:110px;text-align:center;box-shadow:var(--shadow);}
.stat-val{font-size:28px;font-weight:800;color:var(--primary);}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px;}

.loader{
  display:none;position:fixed;inset:0;background:rgba(0,20,66,0.7);
  z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
.loader.show{display:flex;}
.spin{
  width:46px;height:46px;border:4px solid rgba(255,255,255,0.25);
  border-top-color:var(--neon);border-radius:50%;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loader p{color:white;font-size:14px;font-weight:600;}

.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--dark);color:white;padding:10px 24px;border-radius:99px;
  font-size:13px;z-index:500;opacity:0;transition:opacity 0.3s;pointer-events:none;
}
.toast.show{opacity:1;}

.empty{text-align:center;padding:3rem;color:var(--muted);font-size:14px;}

@media(max-width:600px){
  .content{padding:1rem;}
  .student-header{flex-wrap:wrap;gap:0.8rem;}
  .subjects-grid{grid-template-columns:1fr;}
  .stat-box{min-width:80px;}
}

/* App tabs */
.app-tab{padding:12px 20px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);font-family:inherit;border-bottom:3px solid transparent;transition:all 0.15s;margin-left:4px;}
.app-tab:hover{color:var(--primary);}
.app-tab.active{color:var(--primary);border-bottom-color:var(--primary);}

/* Weekly schedule */
.schedule-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:0;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.2rem;}
.sch-header{background:var(--dark);color:white;padding:10px 8px;text-align:center;font-size:12px;font-weight:700;}
.sch-time{background:var(--bg);padding:8px 6px;text-align:center;font-size:10px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;min-height:52px;}
.sch-cell{padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:52px;}
.sch-cell:last-child{border-right:none;}
.sch-slot{background:var(--primary);color:white;border-radius:6px;padding:5px 8px;font-size:11px;height:100%;display:flex;flex-direction:column;justify-content:center;}
.sch-slot-name{font-weight:700;line-height:1.2;}
.sch-slot-sub{font-size:9px;opacity:0.8;margin-top:2px;}

/* Program units */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;}
.unit-card{background:white;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.unit-header{background:var(--dark);color:white;padding:0.9rem 1.1rem;display:flex;align-items:center;gap:10px;}
.unit-num{width:36px;height:36px;border-radius:50%;background:rgba(85,215,255,0.3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;}
.unit-body{padding:1rem 1.1rem;}
.unit-topic{font-size:12px;padding:5px 10px;background:var(--bg);border-radius:6px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.unit-topic-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;}
</style>
</head>
<body>










<!-- LOADER -->
<div class="loader" id="loader"><div class="spin"></div><p>جاري التحميل...</p></div>
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-wrap">

  <!-- Student: ID + password -->
  <div id="studentLoginFields">
    <div class="field">
      <label>الرقم الطلابي</label>
      <input type="text" id="studentId" placeholder="مثال: SUL-001"
        oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="studentPassword" placeholder="أدخل كلمة المرور"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-hint" id="loginHintText">يدخل الطالب بالرقم الطلابي وكلمة المرور لعرض المقررات والدرجات والطلبات.</div>
  </div>

  <!-- Lecturer: username + password -->
  <div id="lecturerLoginFields" style="display:none;">
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="lecUsername" placeholder="أدخل اسم المستخدم"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="lecPassword" placeholder="أدخل كلمة المرور"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
  </div>

function fbRef(path){ return firebase.database().ref(path); }

async function sha256(text){
  const data=new TextEncoder().encode(text);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
}
async function verifyUserPassword(user,password){
  if(!user||!password) return false;
  if(user.passwordHash&&user.passwordSalt) return await sha256(user.passwordSalt+password)===user.passwordHash;
  return user.password===password;
}
async function passwordFields(password){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const bytes=new Uint8Array(16);
  crypto.getRandomValues(bytes);
  const salt=Array.from(bytes,b=>chars[b%chars.length]).join('');
  return {
    passwordHash:await sha256(salt+password),
    passwordSalt:salt,
    password:null,
    passwordChangedAt:new Date().toISOString()
  };
}
async function upgradeLegacyPassword(userKey,user,password){
  if(!userKey||!user?.password||user.passwordHash) return;
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const bytes=new Uint8Array(16);
  crypto.getRandomValues(bytes);
  const salt=Array.from(bytes,b=>chars[b%chars.length]).join('');
  await fbRef('users/'+userKey).update({
    passwordHash:await sha256(salt+password),
    passwordSalt:salt,
    password:null
  });
}

function loader(show){ document.getElementById('loader').classList.toggle('show', show); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function calcTotal(g){
  if(!g) return 0;
  let t=0;
  ['w1','w2','w3','w4'].forEach(w=>{
    const attend = g[w]?.attend ?? g[w+'_attend'] ?? 0;
    const hw     = g[w]?.hw     ?? g[w+'_hw']     ?? 0;
    const disc   = g[w]?.disc   ?? g[w+'_disc']   ?? 0;
    t += attend + hw + disc;
  });
  return Math.round(t + (g.exam||0));
}
function getGrade(t){
  return t>=settings.gradeA?'A':t>=settings.gradeB?'B':t>=settings.gradeC?'C':'F';
}
function pc(t){ return t>=70?'high':t>=50?'mid':'low'; }
function getStatus(t){ return t>=settings.gradeFail?'ناجح':'راسب'; }
function isExamEntered(g){
  if(!g) return false;
  if(g.examEntered===true) return true;
  const exam = g.exam ?? g.exam_score;
  return exam!==undefined && exam!==null && exam!=='' && Number(exam)>0;
}
function isFailingGrade(g){
  return isExamEntered(g) && calcTotal(g)<settings.gradeFail;
}
function getGradeStatus(g){
  return isExamEntered(g) ? getStatus(calcTotal(g)) : 'قيد الرصد';
}
function getActiveSemesters(){
  return Object.entries(dbData.semesters||{})
    .filter(([,s])=>s.status==='active')
    .map(([key,s])=>({key,...s}));
}
function normalizeBatchName(batch){
  return String(batch||'').trim().replace(/\s+/g,' ').toLowerCase();
}
function sameBatchName(a,b){
  return normalizeBatchName(a)===normalizeBatchName(b);
}
function getStudentPlanType(student){
  const direct=String(student?.planType||'').trim().toUpperCase();
  if(direct.includes('QASP')) return 'QASP-S';
  if(direct.includes('QBA')) return 'QBA';
  const pkg=student?.pkg||'';
  const pkgName=Object.entries(dbData.packages||{}).find(([key,p])=>key===pkg||p.name===pkg)?.[1]?.name||pkg;
  const source=`${pkg} ${pkgName}`.toUpperCase();
  if(source.includes('QASP')) return 'QASP-S';
  if(source.includes('QBA')) return 'QBA';
  return '';
}
function isStudentEligibleForSubject(student,subject){
  const eligible=Array.isArray(subject?.eligiblePlans)?subject.eligiblePlans:[];
  const plan=getStudentPlanType(student);
  return !!plan && (!eligible.length||eligible.includes(plan));
}
function activeSubjectKeysForBatch(batch){
  const wanted=normalizeBatchName(batch);
  const active=getActiveSemesters().filter(s=>(s.batches||[]).some(b=>normalizeBatchName(b)===wanted));
  return [...new Set(active.flatMap(s=>s.subjects||[]))];
}

function getStudentSubjectStage(student,subject){
  const grade=getGrade_data(currentUser?.fbKey,subject.key);
  if(grade&&isExamEntered(grade)) return 'completed';
  const activeKeys=activeSubjectKeysForBatch(student?.batch);
  if(activeKeys.includes(subject.key)) return 'active';
  if(subject.lecturerUserId) return 'active';
  return 'planned';
}

async function doLogin(){
  const btn = document.getElementById('loginBtn');
  const loginLabel = btn.dataset.label || btn.textContent || 'دخول ←';
  btn.dataset.label = loginLabel;
  btn.textContent='⏳ جاري التحقق...'; btn.disabled=true;
  document.getElementById('loginErr').style.display='none';
  const fail=()=>{ showErr(); btn.textContent=loginLabel; btn.disabled=false; };

  try{
    if(currentRole==='student'){
      const sid = document.getElementById('studentId').value.trim().toUpperCase();
      const pass = document.getElementById('studentPassword')?.value || '';
      if(!sid||!pass){ fail(); return; }

      const snap = await fbRef('students').get();
      if(!snap.exists()){ fail(); return; }

      let found = null;
      Object.entries(snap.val()).forEach(([k,v])=>{
        if((v.id||'').toUpperCase()===sid) found={...v,_fbKey:k};
      });
      if(!found){ fail(); return; }

      const userSnap = await fbRef('users').get();
      let authUser = null, authKey = null;
      if(userSnap.exists()){
        Object.entries(userSnap.val()).forEach(([k,v])=>{
          if(v.username===sid && v.role==='student'){ authUser={...v,_fbKey:k}; authKey=k; }
        });
      }
      if(!authUser || !(await verifyUserPassword(authUser,pass))){ fail(); return; }
      await upgradeLegacyPassword(authKey,authUser,pass);

      currentUser = {role:'student', data:found, fbKey:found._fbKey, authKey, authUser};
      await loadAllData();
      showStudentView();

    } else {
      const uname = document.getElementById('lecUsername').value.trim();
      const pass  = document.getElementById('lecPassword').value;
      if(!uname||!pass){ fail(); return; }

      const snap = await fbRef('users').get();
      if(!snap.exists()){ fail(); return; }

      let found = null;
      for(const [k,v] of Object.entries(snap.val())){
        if(v.username===uname && v.role==='lecturer' && await verifyUserPassword(v,pass)){
          found={...v,_fbKey:k};
          await upgradeLegacyPassword(k,v,pass);
          break;
        }
      }
      if(!found){ fail(); return; }

      currentUser = {role:'lecturer', data:found, fbKey:found._fbKey, authKey:found._fbKey, authUser:found};
      await loadAllData();
      showLecturerView();
    }
  } catch(e){
    console.error('Login error:',e);
    fail();
    return;
  }

  btn.textContent=loginLabel; btn.disabled=false;
}

function showErr(){
  document.getElementById('loginErr').style.display='block';
}

async function changeMyPassword(){
  if(!currentUser?.authKey){
    toast('تعذر تحديد الحساب');
    return;
  }
  const currentPass=prompt('أدخل كلمة المرور الحالية:');
  if(!currentPass) return;

  try{
    const authSnap=await fbRef('users/'+currentUser.authKey).get();
    const authUser=authSnap.exists()
      ? {...authSnap.val(),_fbKey:currentUser.authKey}
      : currentUser.authUser;

    if(!(await verifyUserPassword(authUser,currentPass))){
      toast('كلمة المرور الحالية غير صحيحة');
      return;
    }

    const newPass=prompt('أدخل كلمة المرور الجديدة (6 أحرف على الأقل):');
    if(!newPass || newPass.length<6){
      toast('كلمة المرور قصيرة');
      return;
    }

    const confirmPass=prompt('أعد إدخال كلمة المرور الجديدة:');
    if(newPass!==confirmPass){
      toast('كلمتا المرور غير متطابقتين');
      return;
    }

    const fields=await passwordFields(newPass);
    await fbRef('users/'+currentUser.authKey).update(fields);
    currentUser.authUser={...authUser,...fields};
    toast('تم تغيير كلمة المرور');
  }catch(e){
    console.error('Change password error:',e);
    toast('تعذر تغيير كلمة المرور');
  }
}

  }
  loader(false);
}

function exportStudentTranscriptCsv(){
  const { st, mySubjects } = getCurrentStudentAcademicData();
  let csv = 'المقرر,المحاضر,المجموع,التقدير,الحالة\n';
  mySubjects.forEach(subject=>{
    const grade = getGrade_data(currentUser.fbKey, subject.key);
    const total = grade ? calcTotal(grade) : 0;
    csv += [subject.name, getLecturerName(subject.lecturerUserId), total, getGrade(total), grade?getStatus(total):'قيد الرصد'].join(',') + '\n';
  });
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `transcript_${st.id||'student'}.csv`;
  a.click();
}

function getStudentSubjects(studentFbKey){
  const result = [];
  const student=dbData.students?.[studentFbKey]||currentUser?.data;
  const addSubject=(subjectKey, allowExplicitEnrollment=false)=>{
    const s=dbData.subjects?.[subjectKey];
    if(s&&(allowExplicitEnrollment||isStudentEligibleForSubject(student,s))&&!result.find(r=>r.key===subjectKey))
      result.push({key:subjectKey,...s});
  };
  Object.values(dbData.enrollments||{}).forEach(e=>{
    if(e.studentKey===studentFbKey && e.subjectKey && dbData.subjects?.[e.subjectKey]){
      addSubject(e.subjectKey,true);
    }
  });
  Object.entries(dbData.subjects||{}).forEach(([subjectKey,subject])=>{
    if(subject.courseKey&&sameBatchName(subject.batch,student?.batch)) addSubject(subjectKey);
  });
  return result;
}

function getGrade_data(studentFbKey, subjectFbKey){
  if(!dbData.grades) return null;
  const semKey = dbData.activeSemesterKey||null;
  // ابحث بالمفتاح المباشر مع الفصل أولاً
  if(semKey){
    const keyWithSem = ('grade_'+studentFbKey+'_'+subjectFbKey+'_'+semKey).replace(/[.#$[\]]/g,'_');
    if(dbData.grades[keyWithSem]) return dbData.grades[keyWithSem];
  }
  // ثم بدون الفصل
  const directKey = ('grade_'+studentFbKey+'_'+subjectFbKey).replace(/[.#$[\]]/g,'_');
  if(dbData.grades[directKey]) return dbData.grades[directKey];
  // أخيراً: ابحث في كل القيم
  return Object.values(dbData.grades).find(g=>
    g.studentKey===studentFbKey && g.subjectKey===subjectFbKey &&
    (!semKey || !g.semesterKey || g.semesterKey===semKey)
  ) || null;
}

function getPortalBatchProfile(batch){
  return PORTAL_BATCH_SEMESTERS[String(batch||'').trim().toUpperCase()] || null;
}
function getCurrentSemesterForBatch(batch){
  const liveSemester = Object.values(dbData.semesters||{}).find(semester=>
    (semester.status==='active' || semester.status==='current') &&
    (semester.batches||[]).some(item=>normalizeBatchName(item)===normalizeBatchName(batch))
  );
  if(liveSemester) return liveSemester;
  const fallback = getPortalBatchProfile(batch);
  return fallback ? {
    name: fallback.name,
    semesterNo: fallback.semesterNo,
    startDate: fallback.startDate,
    endDate: fallback.endDate,
    batches: [fallback.code],
    status: 'current'
  } : null;
}
function sortScheduleSlots(slots){
  const dayOrder = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
  return [...slots].sort((a,b)=>{
    const dayDiff = dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);
    if(dayDiff!==0) return dayDiff;
    return String(a.timeStart||'').localeCompare(String(b.timeStart||''));
  });
}
function getStudentScheduleSlots(student=currentUser?.data){
  if(!student) return [];
  const weekly = Object.values(dbData.schedule?.weekly||{});
  // Only a schedule explicitly assigned to this batch overrides the approved fallback.
  const matched = weekly.filter(slot=>normalizeBatchName(slot.batch)===normalizeBatchName(student.batch));
  if(matched.length) return sortScheduleSlots(matched);
  return sortScheduleSlots(PORTAL_FALLBACK_WEEKLY[String(student.batch||'').trim().toUpperCase()] || []);
}

function getMeetingLinkMarkup(value){

function getLecturerScheduleSlots(){
  const lecturerName = currentUser?.data?.name;
  const mySubjectNames = new Set(getLecturerSubjects().map(subject=>subject.name));
  const weekly = Object.values(dbData.schedule?.weekly||{});
  const matched = weekly.filter(slot=>
    (slot.lecturer && lecturerName && slot.lecturer===lecturerName) ||
    (slot.subject && mySubjectNames.has(slot.subject))
  );
  if(matched.length) return sortScheduleSlots(matched);
  const fallback = getLecturerSubjects().flatMap(subject=>{
    const batchKey = normalizeBatchName(subject.batch);
    return (PORTAL_FALLBACK_WEEKLY[batchKey] || []).filter(slot=>slot.subject===subject.name);
  });
  return sortScheduleSlots(fallback);
}
function getProgramScheduleForRole(){
  if(currentUser?.role==='student'){
    const batchKey = normalizeBatchName(currentUser?.data?.batch);
    return {
      batchKey,
      semester: getPortalBatchProfile(batchKey)
    };
  }
  if(currentUser?.role==='lecturer'){
    const batches = [...new Set([
      ...getLecturerSubjects().map(subject=>normalizeBatchName(subject.batch)),
      ...getLecturerScheduleSlots().map(slot=>normalizeBatchName(slot.batch))
    ].filter(Boolean))];
    return {
      semesterList: batches.map(batchKey=>getPortalBatchProfile(batchKey)).filter(Boolean)
    };
  }
  return {};
}
function getNextUpcomingSlot(slots){
  if(!slots.length) return null;
  const dayOrder = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
  const now = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Riyadh'}));
  const jsDayToAr = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const todayName = jsDayToAr[now.getDay()];
  const todayIndex = dayOrder.indexOf(todayName);
  const currentMinutes = now.getHours()*60 + now.getMinutes();
  const scored = slots.map(slot=>{
    const slotDayIndex = dayOrder.indexOf(slot.day);
    const [hour, minute] = String(slot.timeStart||'00:00').split(':').map(Number);
    let dayOffset = slotDayIndex - todayIndex;
    if(dayOffset<0) dayOffset += 7;
    let minutesScore = dayOffset*1440 + (hour*60+minute-currentMinutes);
    if(minutesScore<0) minutesScore += 7*1440;
    return {slot, minutesScore};
  }).sort((a,b)=>a.minutesScore-b.minutesScore);
  return scored[0]?.slot || null;
}

function getLecturerSubjects(){
  if(!dbData.subjects) return [];
  const u = currentUser.data;
  // جمع كل المعرّفات الممكنة للمحاضر
  const myIds = new Set([
    currentUser.fbKey,
    u.username,
    u.id,
    u._fbKey,
    // أحياناً Firebase key = username مباشرة
    u.username?.toLowerCase(),
  ].filter(Boolean));

  const allMySubjs = Object.entries(dbData.subjects)
    .filter(([k,s])=> {
      if(!s.lecturerUserId) return false;
      // تحقق من التطابق بكل الأشكال
      return myIds.has(s.lecturerUserId) || 
             myIds.has(s.lecturerUserId?.toLowerCase());
    })
    .map(([k,s])=>({key:k,...s}));

  // عند وجود خطط الدفعات الجديدة لا نعرض المقررات القديمة غير المرتبطة بالخطة.
  const hasStructuredSubjects=Object.values(dbData.subjects||{}).some(s=>s.courseKey);
  const operationalSubjects=hasStructuredSubjects
    ? allMySubjs.filter(s=>s.courseKey)
    : allMySubjs;
  // لا تظهر للمحاضر إلا الشعب التي تحتوي على طلاب مسندين فعليًا.
  const assignedSubjects=operationalSubjects.filter(subject=>getSubjectStudents(subject.key).length>0);

  const activeKeys=[...new Set(getActiveSemesters().flatMap(s=>s.subjects||[]))];
  if(!activeKeys.length) return assignedSubjects;
  const activeMine=assignedSubjects.filter(s=>activeKeys.includes(s.key));
  return activeMine.length ? activeMine : assignedSubjects;
}
function getLecturerAcademicData(){
  const mySubjects = getLecturerSubjects();
  const uniqueStudents = new Map();
  const batchMap = {};
  let gradedRows = 0;
  let passedRows = 0;
  let pendingExamRows = 0;
  mySubjects.forEach(subject=>{
    const students = getSubjectStudents(subject.key);
    students.forEach(student=>{
      uniqueStudents.set(student.fbKey, student);
      const grade = getGrade_data(student.fbKey, subject.key);
      if(grade){
        gradedRows++;
        if(isExamEntered(grade) && calcTotal(grade)>=settings.gradeFail) passedRows++;
        if(!isExamEntered(grade)) pendingExamRows++;
      } else {
        pendingExamRows++;
      }
      const batchName = student.batch || subject.batch || 'عامة';
      if(!batchMap[batchName]) batchMap[batchName] = { subjects:new Map(), students:new Map() };
      batchMap[batchName].subjects.set(subject.key, subject);
      batchMap[batchName].students.set(student.fbKey, student);
    });
    if(!students.length){
      const batchName = subject.batch || 'عامة';
      if(!batchMap[batchName]) batchMap[batchName] = { subjects:new Map(), students:new Map() };
      batchMap[batchName].subjects.set(subject.key, subject);
    }
  });
  return {
    mySubjects,
    uniqueStudents:[...uniqueStudents.values()],
    batchMap,
    gradedRows,
    passedRows,
    pendingExamRows
  };
}
function getLecturerPendingGradeAlerts(){
  const alerts = [];
  getLecturerSubjects().forEach(subject=>{
    const students = getSubjectStudents(subject.key);
    const pendingStudents = students.filter(student=>!isExamEntered(getGrade_data(student.fbKey, subject.key)));
    if(pendingStudents.length){

      });
    }
  });
  return alerts.sort((a,b)=>b.pendingCount-a.pendingCount);
}

function getSubjectStudents(subjectFbKey){
  if(!dbData.students) return [];
  const subject=dbData.subjects?.[subjectFbKey]||{};
  const result=[];
  const addStudent=(studentKey)=>{
    const student=dbData.students?.[studentKey];
    if(student && !result.find(r=>r.fbKey===studentKey))
      result.push({fbKey:studentKey,...student});
  };

  // التسجيلات الصريحة هي المصدر الأول.
  Object.values(dbData.enrollments||{}).forEach(e=>{
    if(e.subjectKey===subjectFbKey&&e.studentKey&&dbData.students[e.studentKey]){
      addStudent(e.studentKey);
    }
  });

  // شعب الدفعات الجديدة تعتمد على التسجيلات الصريحة فقط. لا نستنتج الطلاب
  // من اسم الدفعة حتى لا تظهر دفعات أو طلاب غير مسندين للمحاضر.
  if(subject.courseKey&&subject.batch){
    return result;
  }

  // معالجة البيانات القديمة أو الناقصة: استنتج الطلاب من دفعة المادة/الفصل.
  const subjectBatches=new Set();
  if(subject.batch) subjectBatches.add(normalizeBatchName(subject.batch));
  Object.values(dbData.semesters||{}).forEach(sem=>{
    if((sem.subjects||[]).includes(subjectFbKey))
      (sem.batches||[]).forEach(batch=>subjectBatches.add(normalizeBatchName(batch)));
  });
  if(subjectBatches.size){
    Object.entries(dbData.students).forEach(([studentKey,student])=>{
      if(subjectBatches.has(normalizeBatchName(student.batch))&&isStudentEligibleForSubject(student,subject)) addStudent(studentKey);
    });
  }
  return result;
}

async function approveStudentGradeReview(requestKey){
  const request=dbData.studentRequests?.[requestKey];
  if(!request||request.status!=='awaiting_lecturer_review') return toast('الطلب لم يعد متاحًا للمعالجة');
  const field=document.getElementById(gradeReviewInputId('gradeReviewField',requestKey))?.value||'';
  const raw=document.getElementById(gradeReviewInputId('gradeReviewValue',requestKey))?.value.trim()||'';
  const note=document.getElementById(gradeReviewInputId('gradeReviewNote',requestKey))?.value.trim()||'';
  const meta=getGradeReviewFieldMeta(field), value=Number(raw);
  if(raw===''||!Number.isFinite(value)||value<0||value>meta.max) return toast(`أدخل درجة صحيحة من 0 إلى ${meta.max}`);
  const gradeKey=('grade_'+request.studentKey+'_'+request.subjectKey).replace(/[.#$[\]]/g,'_');
  try{
    const fallback=getGrade_data(request.studentKey,request.subjectKey)||{};
    const tx=await fbRef('grades/'+gradeKey).transaction(current=>{
      const existing=current||fallback;
      return {studentKey:request.studentKey,subjectKey:request.subjectKey,w1_attend:existing.w1_attend||0,w1_hw:existing.w1_hw||0,w1_disc:existing.w1_disc||0,w2_attend:existing.w2_attend||0,w2_hw:existing.w2_hw||0,w2_disc:existing.w2_disc||0,w3_attend:existing.w3_attend||0,w3_hw:existing.w3_hw||0,w3_disc:existing.w3_disc||0,w4_attend:existing.w4_attend||0,w4_hw:existing.w4_hw||0,w4_disc:existing.w4_disc||0,exam:isExamEntered(existing)?(existing.exam||0):null,examEntered:isExamEntered(existing),[field]:value,...(field==='exam'?{examEntered:true}:{}),updatedAt:new Date().toISOString()};
    });
    const now=new Date().toISOString(), reviewer=currentUser.data?.name||'عضو هيئة التدريس';
    const update={status:'completed',lecturerNote:note,lecturerReviewedAt:now,lecturerReviewedBy:reviewer,gradeReviewField:field,gradeReviewValue:value,reviewedAt:now,reviewedBy:reviewer};
    await fbRef('studentRequests/'+requestKey).update(update);
    if(!dbData.grades) dbData.grades={};
    dbData.grades[gradeKey]=tx.snapshot.val(); dbData.studentRequests[requestKey]={...request,...update};
    toast('تم اعتماد تعديل الدرجة وتحديث حالة الطلب'); renderGradeInput(currentSubjectKey,currentBatchName);
  }catch(error){console.error('approveStudentGradeReview',error);toast('تعذر اعتماد التعديل');}
}
async function returnStudentGradeReview(requestKey){
  const request=dbData.studentRequests?.[requestKey];
  const note=document.getElementById(gradeReviewInputId('gradeReviewNote',requestKey))?.value.trim()||'';
  if(!request||request.status!=='awaiting_lecturer_review') return toast('الطلب لم يعد متاحًا للمعالجة');
  if(!note) return toast('اكتب ملاحظة توضح سبب إعادة الطلب إلى الإدارة');

async function saveGrades(){
  const btn=document.getElementById('saveBtn');
  btn.textContent='⏳ جاري الحفظ...'; btn.disabled=true;

  try{
    // اجمع كل الحقول المُدخلة مع طالبها
    const byStudent={};
    document.querySelectorAll('#gradeTableBody .grade-input').forEach(inp=>{
      const stKey=inp.dataset.stkey;
      const field=inp.dataset.field;
      const raw=inp.value.trim();
      if(!byStudent[stKey]) byStudent[stKey]={};
      // احفظ الحقل فقط إذا كان فيه قيمة
      if(raw!==''){
        byStudent[stKey][field]=parseFloat(raw)||0;
        if(field==='exam') byStudent[stKey].examEntered=true;
      }
    });

    // لكل طالب: ادمج التغييرات داخل Transaction حتى لا تكتب جلسة فوق أخرى.
    const legacyDeletes={};
    for(const [stKey, newFields] of Object.entries(byStudent)){
      const gradeKey=('grade_'+stKey+'_'+currentSubjectKey).replace(/[.#$[\]]/g,'_');
      const fallback=getGrade_data(stKey,currentSubjectKey)||{};
      const tx=await fbRef('grades/'+gradeKey).transaction(current=>{
        const existing=current||fallback;
        return {
          studentKey:stKey,
          subjectKey:currentSubjectKey,
          w1_attend:existing.w1_attend||0, w1_hw:existing.w1_hw||0, w1_disc:existing.w1_disc||0,
          w2_attend:existing.w2_attend||0, w2_hw:existing.w2_hw||0, w2_disc:existing.w2_disc||0,
          w3_attend:existing.w3_attend||0, w3_hw:existing.w3_hw||0, w3_disc:existing.w3_disc||0,
          w4_attend:existing.w4_attend||0, w4_hw:existing.w4_hw||0, w4_disc:existing.w4_disc||0,
          exam:isExamEntered(existing)?(existing.exam||0):null,
          examEntered:isExamEntered(existing),
          ...newFields,
          updatedAt:new Date().toISOString()
        };
      });
      const merged=tx.snapshot.val();
      const legacyKey=(stKey+'_'+currentSubjectKey).replace(/[.#$[\]]/g,'_');
      if(legacyKey!==gradeKey) legacyDeletes['grades/'+legacyKey]=null;
      // حدّث dbData المحلي فوراً
      if(!dbData.grades) dbData.grades={};
      dbData.grades[gradeKey] = merged;
    }

    if(Object.keys(legacyDeletes).length>0)
      await firebase.database().ref('/').update(legacyDeletes);

    toast('✅ تم حفظ الدرجات');
    renderWeekTable(currentWeek);
    renderSummaryTable(currentSubjectKey); // تحديث ملخص المادة
  }catch(e){
    console.error('saveGrades error:',e);
    toast('❌ خطأ في الحفظ: '+e.message);
  }

  btn.textContent='💾 حفظ الدرجات'; btn.disabled=false;
}

function to12h(time24){
  if(!time24) return '';
  const [h,m] = time24.split(':').map(Number);
  const suffix = h>=12 ? 'م' : 'ص';
  const h12 = h%12 || 12;
  return `${h12}:${String(m).padStart(2,'0')} ${suffix}`;
}

              <th style="background:#d9e8f8;color:#1c2f4d;padding:14px 16px;text-align:center;font-size:13px;font-weight:800;">عضو هيئة التدريس</th>
              <th style="background:#d9e8f8;color:#1c2f4d;padding:14px 16px;text-align:center;font-size:13px;font-weight:800;">اليوم</th>
              <th style="background:#d9e8f8;color:#1c2f4d;padding:14px 16px;text-align:center;font-size:13px;font-weight:800;">رابط المحاضرة</th>
            </tr>
          </thead>
          <tbody>
            ${slots.map((slot,index)=>`
              <tr style="background:${index%2===0?'#ffffff':'#f9fbff'};">
                <td style="padding:14px 16px;border-top:1px solid #e5edf8;font-size:13px;font-weight:700;color:#0f1f3d;">
                  <span style="display:inline-block;width:10px;height:10px;border-radius:999px;background:${slot.color||'#0D40FC'};margin-left:8px;"></span>
                  ${slot.subject||'—'}
                </td>
                <td style="padding:14px 16px;border-top:1px solid #e5edf8;text-align:center;font-size:13px;font-weight:700;color:#334155;">${to12h(slot.timeStart||'18:00')} - ${to12h(slot.timeEnd||'20:00')}</td>
                <td style="padding:14px 16px;border-top:1px solid #e5edf8;text-align:center;font-size:13px;color:#334155;">${slot.lecturer||'غير محدد'}</td>
                <td style="padding:14px 16px;border-top:1px solid #e5edf8;text-align:center;font-size:13px;font-weight:700;color:#334155;">${slot.day||'—'}</td>
                <td style="padding:14px 16px;border-top:1px solid #e5edf8;text-align:center;font-size:13px;">${getMeetingLinkMarkup(slot.room)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderProgramSchedule(units){
  const roleProgram = getProgramScheduleForRole();
  if(currentUser?.role==='student'){
    const semester = roleProgram.semester;
    if(!semester) return '<div class="empty">لا توجد خطة برنامج معتمدة لهذه الدفعة حالياً.</div>';
    return `
      <div style="display:grid;grid-template-columns:1.1fr 0.9fr;gap:14px;margin-bottom:14px;">
        <div class="card" style="background:linear-gradient(135deg,#ffffff,#f8fbff);border:1px solid #dce7ff;">
          <div class="card-title">خطة البرنامج الحالية</div>
          <div style="display:grid;gap:10px;">
            <div style="padding:12px 14px;background:#eef4ff;border-radius:14px;border:1px solid #d9e6ff;">
              <div style="font-size:11px;color:#456">الدفعة</div>
              <div style="font-size:18px;font-weight:900;color:#0D40FC;margin-top:6px">${semester.batchLabel}</div>
              <div style="font-size:12px;color:#456;margin-top:6px">${semester.code}</div>
            </div>
            <div style="padding:12px 14px;background:#f8fbff;border-radius:14px;border:1px solid #e2ebff;">
              <div style="font-size:11px;color:#456">الفصل الحالي</div>
              <div style="font-size:18px;font-weight:900;color:#0f1f3d;margin-top:6px">${semester.name}</div>
              <div style="font-size:12px;color:#456;margin-top:6px">${semester.startDate} إلى ${semester.endDate}</div>
            </div>
          </div>
        </div>
        <div class="card" style="background:linear-gradient(135deg,#ffffff,#fffdf8);border:1px solid #efe3bf;">
          <div class="card-title">التقويم الأكاديمي</div>
          <div style="display:grid;gap:10px;">
            <div style="padding:10px 12px;border-radius:12px;background:#eef8e8;border:1px solid #d7e8c7;font-size:12px;"><strong>بداية الدراسة:</strong> 2026/08/24</div>
            <div style="padding:10px 12px;border-radius:12px;background:#f8fbff;border:1px solid #e2ebff;font-size:12px;"><strong>السنة الأكاديمية:</strong> 2026/2027</div>
          </div>
        </div>
      </div>
      ${renderAcademicCalendar([semester.semesterNo], getStudentPlanType(currentUser?.data)==='QASP-S'?4:6)}`;
  }
  const lecturerSemesters = roleProgram.semesterList || [];
  const unitList = Object.entries(units).sort(([,a],[,b])=>Number(a.order||0)-Number(b.order||0));
  if(currentUser?.role==='lecturer'){
    return `
      <div class="card" style="background:linear-gradient(135deg,#ffffff,#f8fbff);border:1px solid #dce7ff;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          <div><div class="card-title" style="margin:0;border:none;padding:0;">التقويم الأكاديمي للبرنامج</div><div style="font-size:12px;color:var(--muted);margin-top:7px;">بداية البرنامج: 23 أغسطس 2026 · نهاية البرنامج: 1 مايو 2027</div></div>
          <span class="badge badge-pass">4 أسابيع دراسة · أسبوع اختبارات · أسبوع إجازة</span>
        </div>
        ${lecturerSemesters.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px;">
          ${lecturerSemesters.map(semester=>`
            <div style="padding:14px 16px;border:1px solid #e2ebff;border-radius:16px;background:#fff;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                <div>
                  <div style="font-size:15px;font-weight:900;color:#0f1f3d;">${semester.batchLabel}</div>
                  <div style="font-size:12px;color:#5b6b82;margin-top:4px;">${semester.code}</div>
                </div>
                <span style="padding:8px 12px;border-radius:999px;background:#eef4ff;color:#0D40FC;font-size:12px;font-weight:800;">${semester.name}</span>
              </div>
              <div style="font-size:12px;color:#5b6b82;margin-top:10px;">الفترة المعتمدة: ${semester.startDate} إلى ${semester.endDate}</div>
            </div>`).join('')}
        </div>`:'<div class="alert alert-info" style="margin-bottom:16px;">التقويم العام معتمد ويظهر كاملًا إلى حين ربط دفعات إضافية بالحساب.</div>'}
        ${renderAcademicCalendar(lecturerSemesters.map(semester=>semester.semesterNo))}
        ${unitList.length?`<div class="program-calendar-grid" style="margin-top:16px">${unitList.map(([key,unit])=>{
          const type=String(unit.title||'');
          const itemClass=type.includes('اختبارات')?'exam':type.includes('إجازة')?'break':'';
          return `<div class="program-calendar-item ${itemClass}"><div class="program-calendar-order">${unit.order||'—'}</div><div><div class="program-calendar-title">${unit.title||'مرحلة البرنامج'}</div><div class="program-calendar-date">${unit.dateRange||'التاريخ غير محدد'}</div><div class="program-calendar-duration">${unit.duration||''}</div></div></div>`;
        }).join('')}</div>`:''}
      </div>`;
  }
  if(!unitList.length) return '<div class="empty">لا توجد بيانات برنامج معتمدة حالياً.</div>';
  return `<div class="units-grid">
    ${unitList.map(([key,unit],i)=>`
      <div class="unit-card">
        <div class="unit-header" style="background:#0D40FC">
          <div class="unit-num">${unit.order||i+1}</div>
          <div>
            <div style="font-size:13px;font-weight:700">${unit.title||'وحدة '+(i+1)}</div>
            ${unit.dateRange?`<div style="font-size:10px;opacity:0.7">📅 ${unit.dateRange}</div>`:''}
          </div>
        </div>
        <div class="unit-body">
          ${unit.description?`<p style="font-size:12px;color:var(--muted);margin-bottom:8px">${unit.description}</p>`:''}
          ${(unit.topics||[]).map(t=>`<div class="unit-topic"><div class="unit-topic-dot"></div><span style="font-size:12px">${t}</span></div>`).join('')}
        </div>
      </div>`).join('')}
  </div>`;
}

function renderAcademicCalendar(activeSemesters=[], maxTerms=6){
  const activeSet=new Set(activeSemesters.filter(Boolean).map(Number));
  return `
    <div class="card" style="background:linear-gradient(135deg,#ffffff,#f8fbff);border:1px solid #dce7ff;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
        <div><div class="card-title" style="margin:0;border:none;padding:0;">التقويم الأكاديمي 2026-2027</div><div style="font-size:12px;color:var(--muted);margin-top:7px;">بداية البرنامج: 23 أغسطس 2026 · نهاية البرنامج: 1 مايو 2027</div></div>
        <span class="badge badge-pass">4 أسابيع دراسة · أسبوع اختبارات · أسبوع إجازة</span>
      </div>
      <div class="program-calendar-grid">
        ${PORTAL_ACADEMIC_CALENDAR.filter(term=>term.order<=maxTerms).map(term=>{
          const active=activeSet.has(term.order);
          return `<div class="program-calendar-item" style="border-color:${active?term.color:'#e0e9f8'};background:${active?'#f8fbff':'#fff'};border-right:5px solid ${term.color};">
            <div class="program-calendar-order" style="background:${term.color};color:#fff;">${term.order}</div>
            <div><div class="program-calendar-title">${term.title}${active?' · الفصل الحالي':''}</div>
              <div class="program-calendar-date"><strong>الدراسة:</strong> ${term.study}</div>
              <div class="program-calendar-date"><strong>الاختبارات:</strong> ${term.exam}</div>
              <div class="program-calendar-date"><strong>الإجازة:</strong> ${term.break}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}
