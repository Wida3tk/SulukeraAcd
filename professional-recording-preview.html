<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة تسجيلات البرنامج المهني | سلوكيرا</title><link rel="stylesheet" href="professional-recording.css?v=20261013"><style>body{margin:0;background:#f4f7fc;font-family:Tahoma,Arial;color:#193754}main{max-width:1000px;margin:45px auto;padding:25px;background:#fff;border-radius:20px}h1{font-size:25px}.btn,.btn-out{font-family:inherit;cursor:pointer;padding:12px 18px;border-radius:10px;border:1px solid #ccdaef;background:white;color:#193754}.btn{background:#174cbb;color:white}.meetings{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}select{font:inherit;padding:12px;max-width:100%}.rec-player video{max-height:65vh}a{color:#174cbb}</style><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script></head><body><main><a href="index.html">سلوكيرا · العودة للإدارة</a><h1>معاينة تسجيلات البرنامج المهني</h1><p class="rec-player-note">مساحة تجربة للإدارة. تشغيل الفيديو هنا لا يضيف مشاهدة أو حضورًا لأي متدرب.</p><p id="previewStatus" role="status">التحقق من جلسة الإدارة…</p><div id="previewContent"></div></main><script>
const firebaseConfig = {
  apiKey: "AIzaSyCbzP7PACrvRfjwGESFhupi1by1f33IM6I",
  authDomain: "sulukeraacd.firebaseapp.com",
  databaseURL: "https://sulukeraacd-default-rtdb.firebaseio.com",
  projectId: "sulukeraacd",
  storageBucket: "sulukeraacd.firebasestorage.app",
  messagingSenderId: "373919022309",
  appId: "1:373919022309:web:64648d54f63c3660cae80c"
};
firebase.initializeApp(firebaseConfig);let currentUser=null;const EXAM_API_BASE='https://sulukera-exams.ro7e-entaa.workers.dev';
function escapeHtml(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');}
function showToast(message){document.getElementById('previewStatus').textContent=message;}
async function secureAdminExamRequest(path,options={}){const user=firebase.auth().currentUser;if(!user)throw Error('UNAUTHENTICATED');const response=await fetch(EXAM_API_BASE+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+await user.getIdToken()}});const data=await response.json();if(!response.ok)throw Error(data.error);return data;}
let previewUnits=[];
function drawPreview(){const item=previewUnits[Number(document.getElementById('previewUnit').value)||0];document.getElementById('previewMeetings').innerHTML=Array.from({length:5},(_,i)=>{const key='session_'+(i+1),session=item?.unit.sessions?.[key];return '<button class="btn-out" data-unit="'+escapeHtml(item?.id)+'" data-session="'+key+'" onclick="recordingPreviewAdmin(this)" '+(!session?.recordingUrl?'disabled':'')+'>معاينة اللقاء '+(i+1)+'</button>';}).join('');}
firebase.auth().onAuthStateChanged(async user=>{if(!user){showToast('سجّل الدخول في صفحة الإدارة أولًا، ثم افتح هذه الصفحة.');return;}try{const profile=(await firebase.database().ref('users/'+user.uid).get()).val();if(!['admin','academic_admin'].includes(profile?.role)){showToast('هذه المعاينة متاحة للإدارة فقط.');return;}currentUser=profile;const program=(await firebase.database().ref('professionalPrograms/organizational_behavior').get()).val();previewUnits=Object.entries(program?.tracks||{}).flatMap(([track,t])=>Object.entries(t.units||{}).filter(([,u])=>u.status==='published').map(([key,unit])=>({id:track+'_'+key,unit})));document.getElementById('previewContent').innerHTML='<select id="previewUnit" onchange="drawPreview()">'+previewUnits.map((u,i)=>'<option value="'+i+'">'+escapeHtml(u.unit.title)+'</option>').join('')+'</select><div class="meetings" id="previewMeetings"></div>';drawPreview();const connection=await secureAdminExamRequest('/admin/professional-recordings/connection');showToast(connection.ready?'✓ المجلد متصل: '+connection.folderName:'صلاحية قراءة المجلد تحتاج مراجعة.');}catch{showToast('تعذر تحميل المعاينة. تحقق من جلسة الإدارة.');}});
</script><script src="professional-recording-ui.js?v=20261013b"></script></body></html>
